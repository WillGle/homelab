---
- name: Cài đặt Docker Engine và Docker Compose cho các App Nodes
  hosts: docker_hosts
  tasks:
    - name: 1. Tạo thư mục chứa keyring apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 2. Tải Docker GPG Key chính thức
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: 3. Thêm Docker APT Repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable"
        state: present
        filename: docker

    - name: 4. Cài đặt Docker Engine và Docker Compose Plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: 5. Kích hoạt và bật dịch vụ Docker khởi động cùng hệ thống
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
