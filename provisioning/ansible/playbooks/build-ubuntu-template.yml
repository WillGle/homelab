---
- name: Build Ubuntu 24.04 cloud-init template
  hosts: pve-mini
  gather_facts: false

  vars:
    template_vmid: 9000
    template_name: ubuntu-2404-cloud
    template_storage: mini-sata

    cloud_image_url: >-
      https://cloud-images.ubuntu.com/releases/server/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img

    cloud_image_path: >-
      /var/lib/vz/template/iso/ubuntu-24.04-server-cloudimg-amd64.img

  tasks:
    - name: Ensure ISO directory exists
      ansible.builtin.file:
        path: /var/lib/vz/template/iso
        state: directory
        mode: "0755"

    - name: Download Ubuntu cloud image
      ansible.builtin.get_url:
        url: "{{ cloud_image_url }}"
        dest: "{{ cloud_image_path }}"
        mode: "0644"

    - name: Check whether template VMID exists
      ansible.builtin.stat:
        path: "/etc/pve/qemu-server/{{ template_vmid }}.conf"
      register: template_file

    - name: Preview Proxmox CLI actions
      ansible.builtin.debug:
        msg: >-
          Check mode does not simulate qm changes. A normal run will create
          VMID {{ template_vmid }} if absent, resume missing disk/configuration
          steps, and convert it to template {{ template_name }}.
      when: ansible_check_mode

    - name: Create template VM when absent
      ansible.builtin.command:
        cmd: >-
          qm create {{ template_vmid }}
          --name {{ template_name }}
          --memory 2048
          --cores 2
          --net0 virtio,bridge=vmbr0
      when:
        - not ansible_check_mode
        - not template_file.stat.exists

    - name: Read current template configuration
      ansible.builtin.command:
        cmd: "qm config {{ template_vmid }}"
      register: template_config
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Ensure VMID belongs to this template
      ansible.builtin.assert:
        that:
          - "('name: ' ~ template_name) in template_config.stdout"
        fail_msg: "VMID {{ template_vmid }} exists but is not {{ template_name }}; refusing to modify it."
      when: not ansible_check_mode

    - name: Import cloud image when disk is absent
      ansible.builtin.command:
        cmd: >-
          qm set {{ template_vmid }}
          --scsihw virtio-scsi-pci
          --scsi0 {{ template_storage }}:0,import-from={{ cloud_image_path }}
      when:
        - not ansible_check_mode
        - "'template: 1' not in template_config.stdout"
        - "'scsi0:' not in template_config.stdout"

    - name: Configure cloud-init and boot options when incomplete
      ansible.builtin.command:
        cmd: >-
          qm set {{ template_vmid }}
          --scsihw virtio-scsi-pci
          --ide2 {{ template_storage }}:cloudinit
          --boot order=scsi0
          --serial0 socket
          --vga serial0
          --agent enabled=1
      when:
        - not ansible_check_mode
        - "'template: 1' not in template_config.stdout"
        - >-
          not (
            'scsihw: virtio-scsi-pci' in template_config.stdout and
            ('ide2: ' ~ template_storage ~ ':') in template_config.stdout and
            'boot: order=scsi0' in template_config.stdout and
            'serial0: socket' in template_config.stdout and
            'vga: serial0' in template_config.stdout and
            'agent: enabled=1' in template_config.stdout
          )

    - name: Convert VM to template when needed
      ansible.builtin.command:
        cmd: "qm template {{ template_vmid }}"
      when:
        - not ansible_check_mode
        - "'template: 1' not in template_config.stdout"

    - name: Verify resulting template
      ansible.builtin.command:
        cmd: "qm config {{ template_vmid }}"
      register: verified_template
      changed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Assert template conversion completed
      ansible.builtin.assert:
        that:
          - "'template: 1' in verified_template.stdout"
          - "('name: ' ~ template_name) in verified_template.stdout"
          - "'scsi0:' in verified_template.stdout"
          - "'ide2:' in verified_template.stdout"
      when: not ansible_check_mode
